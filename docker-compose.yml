services:
  web:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    ports:
      - "80:80"
    volumes:
      - app_data:/usr/share/nginx/html
    depends_on:
      - php
  php:
    build:
      context: .
      dockerfile: PHP.Dockerfile
    volumes:
      - app_data:/usr/share/nginx/html
    expose:
      - "9000"
  mysql:
    image: mariadb:11.7.1-ubi9-rc
    environment:
      MYSQL_ROOT_PASSWORD: "secret"
      MYSQL_DATABASE: "ProBook"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/:/docker-entrypoint-initdb.d
    ports:
      - "3360:3306"
volumes:
  app_data:
  mysql_data:
networks:
  default:
    driver: bridge
