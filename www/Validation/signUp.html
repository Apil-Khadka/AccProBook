<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup Page</title>
    <link rel="stylesheet" href="signin.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>

  <body>
    <div class="container">
      <div class="companyName">
        PROBOOK
        <img
          class="logo"
          src="star_sparkle_stars_sparkles_icon_new.png"
          alt="Logo"
        />
      </div>

      <form id="signupForm">
        <h3>SIGN UP</h3>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <span id="emailError" class="error-message"></span>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />
        <span id="passwordError" class="error-message"></span>

        <button type="submit">Create Account</button>
      </form>

      <span id="serverError" class="error-message"></span>
      <span id="serverSuccess" class="success-message"></span>
    </div>

    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const serverError = document.getElementById("serverError");
          const serverSuccess = document.getElementById("serverSuccess");

          serverError.textContent = "";
          serverSuccess.textContent = "";

          const formData = new FormData(this);

          axios
            .post("signUp_validation.php", formData)
            .then(function (response) {
              console.log(response);
              if (response.data.success) {
                serverSuccess.textContent = response.data.message;

                setTimeout(() => {
                  window.location.href = "signIn.html"; // redirect to login
                }, 3000);
              } else {
                serverError.textContent = response.data.message;
              }
            })
            .catch(function (error) {
              console.error(error);
              serverError.textContent =
                "There was an error submitting the form.";
            });
        });
    </script>
  </body>
</html>
